
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4ff">
  <title>BaiiSelf | Game Review Hub</title>

  <style>
    :root {
      --blue: #5796e8;
      --navy: #234e88;
      --pale: #eaf4ff;
      --white: #ffffff;
      --text: #243650;
      --muted: #71839b;
      --border: #dce9f8;
      --gold: #f5b942;
      --card: #ffffff;
      --page: #f7fbff;
      --shadow: 0 8px 24px rgba(35, 78, 136, .09);
    }

    body.dark {
      --text: #edf4ff;
      --muted: #a7bad5;
      --border: #344967;
      --card: #19283d;
      --page: #101b2c;
      --pale: #203751;
      --white: #19283d;
      --shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: var(--page);
      color: var(--text);
      transition: background .2s, color .2s;
    }

    button, input, select { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1150px;
      margin: auto;
      padding: 15px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      color: var(--navy);
      font-weight: 800;
      font-size: 25px;
      text-decoration: none;
    }

    body.dark .logo { color: #9ccaff; }

    .logo span { color: var(--blue); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-button, .secondary-button {
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--pale);
      color: var(--navy);
      font-weight: 700;
    }

    body.dark .theme-button,
    body.dark .secondary-button { color: #d8e9ff; }

    .hero {
      max-width: 1150px;
      margin: 28px auto 20px;
      padding: 34px 24px;
    }

    .hero-panel {
      padding: 38px 30px;
      border-radius: 24px;
      background: linear-gradient(125deg, #eaf4ff, #c9e1ff);
      position: relative;
      overflow: hidden;
    }

    body.dark .hero-panel {
      background: linear-gradient(125deg, #203751, #263e60);
    }

    .hero-panel::after {
      content: "✿";
      position: absolute;
      right: 30px;
      top: -30px;
      font-size: 140px;
      color: rgba(87, 150, 232, .18);
    }

    .hero h1 {
      color: var(--navy);
      font-size: clamp(28px, 5vw, 43px);
      margin: 0 0 12px;
      position: relative;
      z-index: 1;
    }

    body.dark .hero h1 { color: #d8e9ff; }

    .hero p {
      max-width: 570px;
      line-height: 1.8;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    .section {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 24px 45px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .section-heading h2 { margin: 0; }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .filters input, .filters select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      outline-color: var(--blue);
    }

    .filters input {
      flex: 1;
      min-width: 180px;
    }

    .filters select { min-width: 155px; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
      gap: 22px;
    }

    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .2s;
    }

    .game-card:hover { transform: translateY(-4px); }

    .cover-wrap {
      position: relative;
      aspect-ratio: 16 / 10;
      background: var(--pale);
      overflow: hidden;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .category-badge {
      position: absolute;
      left: 12px;
      top: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      color: #234e88;
      background: rgba(255, 255, 255, .92);
      font-size: 12px;
      font-weight: 700;
    }

    .game-info { padding: 17px; }

    .game-info h3 {
      margin: 0 0 10px;
      font-size: 19px;
    }

    .game-info p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      min-height: 44px;
      margin: 0 0 12px;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 15px;
      flex-wrap: wrap;
    }

    .stars {
      display: inline-flex;
      align-items: center;
      color: var(--gold);
      letter-spacing: 1px;
      font-size: 18px;
      white-space: nowrap;
    }

    .star {
      display: inline-block;
      position: relative;
    }

    .star.half {
      background: linear-gradient(90deg, var(--gold) 50%, #c8d2df 50%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rating-number {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .review-button {
      width: 100%;
      border-radius: 12px;
      padding: 12px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      transition: background .2s;
    }

    .review-button:hover { background: var(--navy); }

    .empty {
      padding: 35px;
      text-align: center;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    /* Review modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      padding: 20px;
      background: rgba(10, 25, 45, .72);
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      position: relative;
      width: min(850px, 100%);
      margin: auto;
      padding: 25px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 15px 50px rgba(0, 0, 0, .25);
    }

    .close-button {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--pale);
      color: var(--text);
      font-size: 22px;
      z-index: 2;
    }

    .review-title {
      padding-right: 40px;
      margin: 3px 0 8px;
      font-size: 27px;
    }

    .review-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .review-description {
      line-height: 1.8;
      color: var(--muted);
      white-space: pre-line;
    }

    .gallery {
      position: relative;
      margin: 20px 0;
      border-radius: 16px;
      overflow: hidden;
      background: #0c1727;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: min(440px, 60vw);
      min-height: 220px;
      object-fit: contain;
      cursor: zoom-in;
    }

    .gallery-label {
      position: absolute;
      left: 12px;
      top: 12px;
      padding: 7px 11px;
      border-radius: 10px;
      color: white;
      background: rgba(10, 25, 45, .75);
      font-size: 12px;
      z-index: 1;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .9);
      color: #234e88;
      font-size: 23px;
      z-index: 1;
    }

    .gallery-arrow.prev { left: 12px; }
    .gallery-arrow.next { right: 12px; }

    .gallery-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .gallery-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex: 1;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #b7c7da;
      padding: 0;
    }

    .dot.active { background: var(--blue); }

    .image-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    /* Image zoom */
    .zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, .92);
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }

    .zoom-overlay.open { display: flex; }

    .zoom-overlay img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .nav { padding: 12px 16px; }
      .logo { font-size: 21px; }
      .hero { padding: 20px 16px; }
      .hero-panel { padding: 28px 20px; }
      .section { padding: 0 16px 35px; }
      .modal { padding: 10px; }
      .modal-content { padding: 18px; }
      .review-title { font-size: 23px; }
      .gallery img { height: 58vw; }
    }
  </style>
</head>

<body>
  <header>
    <div class="nav">
      <a class="logo" href="#">Baii<span>Self</span> ✿</a>
      <div class="nav-right">
        <button class="theme-button" id="themeToggle" type="button">
          ☾ Dark Mode
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-panel">
        <h1>Find Your Next Game ✿</h1>
        <p>
          พื้นที่รีวิวเกมในแบบของ BaiiSelf
          รวมเกมที่น่าสนใจ ความประทับใจ ข้อดี และสิ่งที่ควรรู้ก่อนเริ่มเล่น
        </p>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Explore Games</h2>
        <span id="gameCount"></span>
      </div>

      <div class="filters">
        <input
          type="search"
          id="searchInput"
          placeholder="ค้นหาชื่อเกม..."
          aria-label="ค้นหาชื่อเกม"
        >
        <select id="categoryFilter" aria-label="เลือกหมวดหมู่">
          <option value="all">ทุกหมวดหมู่</option>
          <option value="Action RPG">Action RPG</option>
          <option value="Adventure">Adventure</option>
          <option value="Sandbox">Sandbox</option>
          <option value="Rhythm">Rhythm</option>
          <option value="Simulation">Simulation</option>
        </select>
      </div>

      <div class="game-grid" id="gameGrid"></div>
    </section>
  </main>

  <footer>
    BaiiSelf | Game Review Hub ✿ Made with love for games
  </footer>

  <!-- Review modal -->
  <div class="modal" id="reviewModal" role="dialog"
       aria-modal="true" aria-label="รายละเอียดรีวิวเกม">
    <div class="modal-content">
      <button class="close-button" id="closeModal"
              aria-label="ปิดรีวิว" type="button">×</button>

      <h2 class="review-title" id="reviewTitle"></h2>

      <div class="review-meta">
        <span id="reviewCategory"></span>
        <div id="reviewRating"></div>
      </div>

      <div class="gallery">
        <span class="gallery-label" id="galleryLabel">Cover</span>
        <img id="galleryImage" src="" alt="ภาพเกม"
             title="คลิกเพื่อขยายภาพ">

        <button class="gallery-arrow prev" id="prevImage"
                aria-label="ภาพก่อนหน้า" type="button">‹</button>
        <button class="gallery-arrow next" id="nextImage"
                aria-label="ภาพถัดไป" type="button">›</button>
      </div>

      <div class="gallery-footer">
        <span class="image-count" id="imageCount"></span>
        <div class="gallery-dots" id="galleryDots"></div>
      </div>

      <p class="review-description" id="reviewDescription"></p>

      <h3>Pros</h3>
      <ul id="reviewPros"></ul>

      <h3>Cons</h3>
      <ul id="reviewCons"></ul>

      <h3>เหมาะสำหรับใคร?</h3>
      <p class="review-description" id="reviewAudience"></p>
    </div>
  </div>

  <!-- Zoom image -->
  <div class="zoom-overlay" id="zoomOverlay" aria-label="ภาพขยาย">
    <img id="zoomImage" src="" alt="ภาพเกมขยาย">
  </div>

  <script>
    /*
      คะแนนตัวอย่าง 0–5 ดาว
      เปลี่ยนค่า score ของแต่ละเกมได้ตามต้องการ
    */
    const games = [
      {
        name: "Elden Ring",
        category: "Action RPG",
        score: 4.5,
        folder: "images/elden-ring",
        cover: "cover.jpg",
        screenshots: ["scene-1.jpg", "scene-2.jpg", "scene-3.jpg"],
        description:
          "เกม Action RPG ในโลกแฟนตาซีขนาดใหญ่ สำรวจดินแดน ต่อสู้กับศัตรู และค้นพบเรื่องราวผ่านโลกของเกม",
        pros: [
          "โลกกว้างและมีอะไรให้สำรวจ",
          "การต่อสู้ท้าทาย",
          "มีอิสระในการพัฒนาตัวละคร"
        ],
        cons: [
          "ความยากอาจไม่เหมาะกับทุกคน",
          "อาจต้องใช้เวลาเรียนรู้ระบบเกม"
        ],
        audience: "คนที่ชอบเกม RPG โลกแฟนตาซี และความท้าทาย"
      },
      {
        name: "Genshin Impact",
        category: "Action RPG",
        score: 4.5,
        folder: "images/genshin impact",
        cover: "genshin-impact-cover.jpg",
        screenshots: ["scene-1.jpg", "scene-2.jpg", "scene-3.jpg"],
        description:
          "เกม Open-world RPG ที่มีตัวละครหลากหลาย ธาตุสำหรับการต่อสู้ และโลกให้เดินทางสำรวจ",
        pros: [
          "โลกสวยและมีรายละเอียด",
          "ตัวละครมีเอกลักษณ์",
          "สำรวจโลกได้อย่างอิสระ"
        ],
        cons: [
          "การพัฒนาตัวละครใช้เวลา",
          "มีระบบสุ่มตัวละคร"
        ],
        audience: "คนที่ชอบสำรวจโลก แฟนตาซี และสะสมตัวละคร"
      },
      {
        name: "Minecraft",
        category: "Sandbox",
        score: 5,
        folder: "images/minecraft",
        cover: "cover.jpg",
        screenshots: ["scene-1.jpg", "scene-2.jpg", "scene-3.jpg"],
        description:
          "เกม Sandbox ที่ให้สร้างสิ่งต่าง ๆ สำรวจโลก และเล่นตามสไตล์ของตัวเอง",
        pros: [
          "มีอิสระในการเล่นสูง",
          "สร้างสรรค์ได้หลากหลาย",
          "เล่นกับเพื่อนได้"
        ],
        cons: [
          "ผู้เล่นใหม่อาจไม่รู้ว่าจะเริ่มจากตรงไหน",
          "ภาพกราฟิกเป็นสไตล์เฉพาะตัว"
        ],
        audience: "คนที่ชอบสร้าง สำรวจ และเล่นอย่างอิสระ"
      },
      {
        name: "Wuthering Waves",
        category: "Action RPG",
        score: 4.5,
        folder: "images/wuthering waves",
        cover: "wuthering-waves-cover.jpg",
        screenshots: ["scene-1.jpg", "scene-2.jpg", "scene-3.jpg"],
        description:
          "เกม Action RPG ที่เน้นการต่อสู้แบบรวดเร็ว การหลบหลีก และการสำรวจโลก",
        pros: [
          "ระบบต่อสู้ลื่นไหล",
          "ตัวละครมีสไตล์",
          "มีพื้นที่ให้สำรวจ"
        ],
        cons: [
          "ระบบบางส่วนต้องใช้เวลาเรียนรู้",
          "การพัฒนาตัวละครต้องใช้ทรัพยากร"
        ],
        audience: "คนที่ชอบเกมแอ็กชัน จังหวะต่อสู้รวดเร็ว และสำรวจโลก"
      },
      {
        name: "Stardew Valley",
        category: "Simulation",
        score: 4.5,
        folder: "images/stardew-valley",
        cover: "cover.jpg",
        screenshots: ["scene-1.jpg", "scene-2.jpg", "scene-3.jpg"],
        description:
          "เกมจำลองการใช้ชีวิตในฟาร์ม ปลูกผัก เลี้ยงสัตว์ ตกปลา และสร้างความสัมพันธ์กับชาวเมือง",
        pros: [
          "เล่นได้เรื่อย ๆ ตามจังหวะของตัวเอง",
          "กิจกรรมหลากหลาย",
          "เหมาะกับการเล่นเพื่อผ่อนคลาย"
        ],
        cons: [
          "ช่วงแรกอาจต้องเรียนรู้หลายระบบ",
          "ภาพพิกเซลอาจไม่ใช่สไตล์ที่ทุกคนชอบ"
        ],
        audience: "คนที่ชอบเกมสบาย ๆ การทำฟาร์ม และการใช้ชีวิต"
      }
    ];

    const gameGrid = document.getElementById("gameGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const modal = document.getElementById("reviewModal");

    let currentGame = null;
    let currentImageIndex = 0;

    // สร้างดาวเต็ม ดาวครึ่ง และดาวว่าง
    function renderRating(score) {
      const safeScore = Math.max(0, Math.min(5, Number(score) || 0));
      const fullStars = Math.floor(safeScore);
      const hasHalfStar = safeScore - fullStars >= 0.25 &&
                          safeScore - fullStars < 0.75;
      const roundedFullStars = safeScore - fullStars >= 0.75
        ? fullStars + 1
        : fullStars;
      const emptyStars = 5 - roundedFullStars - (hasHalfStar ? 1 : 0);

      let starsHTML = "";

      for (let i = 0; i < roundedFullStars; i++) {
        starsHTML += '<span class="star">★</span>';
      }

      if (hasHalfStar) {
        starsHTML += '<span class="star half">★</span>';
      }

      for (let i = 0; i < emptyStars; i++) {
        starsHTML += '<span class="star" style="color:#c8d2df">☆</span>';
      }

      return `
        <div class="rating" aria-label="คะแนน ${safeScore} จาก 5">
          <span class="stars">${starsHTML}</span>
          <span class="rating-number">${safeScore.toFixed(1)}/5</span>
        </div>
      `;
    }

    function renderGames() {
      const query = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;

      const filtered = games.filter(game => {
        const matchesName = game.name.toLowerCase().includes(query);
        const matchesCategory =
          category === "all" || game.category === category;

        return matchesName && matchesCategory;
      });

      document.getElementById("gameCount").textContent =
        `${filtered.length} games`;

      if (!filtered.length) {
        gameGrid.innerHTML =
          '<div class="empty">ไม่พบเกมที่ค้นหา ลองค้นหาด้วยชื่ออื่น</div>';
        return;
      }

      gameGrid.innerHTML = filtered.map(game => `
        <article class="game-card">
          <div class="cover-wrap">
            <img
              src="${escapeHTML(game.folder + "/" + game.cover)}"
              alt="${escapeHTML(game.name)} cover"
              loading="lazy"
              onerror="this.style.display='none'"
            >
            <span class="category-badge">
              ${escapeHTML(game.category)}
            </span>
          </div>

          <div class="game-info">
            <h3>${escapeHTML(game.name)}</h3>
            <p>${escapeHTML(game.description)}</p>
            ${renderRating(game.score)}
            <button
              class="review-button"
              type="button"
              data-review="${escapeHTML(game.name)}"
            >
              View Review →
            </button>
          </div>
        </article>
      `).join("");
    }

    // ป้องกันข้อความจากข้อมูลเกมถูกตีความเป็น HTML
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function openReview(name) {
      currentGame = games.find(game => game.name === name);
      if (!currentGame) return;

      currentImageIndex = 0;

      document.getElementById("reviewTitle").textContent =
        currentGame.name;

      document.getElementById("reviewCategory").textContent =
        currentGame.category;

      document.getElementById("reviewRating").innerHTML =
        renderRating(currentGame.score);

      document.getElementById("reviewDescription").textContent =
        currentGame.description;

      document.getElementById("reviewAudience").textContent =
        currentGame.audience;

      document.getElementById("reviewPros").innerHTML =
        currentGame.pros.map(item =>
          `<li>${escapeHTML(item)}</li>`
        ).join("");

      document.getElementById("reviewCons").innerHTML =
        currentGame.cons.map(item =>
          `<li>${escapeHTML(item)}</li>`
        ).join("");

      renderGallery();
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    // ลำดับภาพ: Cover ก่อน แล้วตามด้วย Screenshot 1–3
    function getGalleryImages() {
      return [
        {
          src: `${currentGame.folder}/${currentGame.cover}`,
          label: "Cover"
        },
        ...currentGame.screenshots.map((image, index) => ({
          src: `${currentGame.folder}/${image}`,
          label: `Screenshot ${index + 1}`
        }))
      ];
    }

    function renderGallery() {
      const images = getGalleryImages();
      const image = images[currentImageIndex];

      const galleryImage = document.getElementById("galleryImage");
      galleryImage.src = image.src;
      galleryImage.alt = `${currentGame.name} - ${image.label}`;

      document.getElementById("galleryLabel").textContent = image.label;

      document.getElementById("imageCount").textContent =
        `${currentImageIndex + 1} / ${images.length}`;

      document.getElementById("galleryDots").innerHTML =
        images.map((item, index) => `
          <button
            class="dot ${index === currentImageIndex ? "active" : ""}"
            type="button"
            data-image="${index}"
            aria-label="ดู${escapeHTML(item.label)}"
            title="${escapeHTML(item.label)}"
          ></button>
        `).join("");
    }

    function changeImage(direction) {
      if (!currentGame) return;

      const images = getGalleryImages();
      currentImageIndex =
        (currentImageIndex + direction + images.length) % images.length;

      renderGallery();
    }

    function closeReview() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
      currentGame = null;
    }

    gameGrid.addEventListener("click", event => {
      const button = event.target.closest("[data-review]");
      if (button) openReview(button.dataset.review);
    });

    document.getElementById("prevImage").addEventListener("click", () => {
      changeImage(-1);
    });

    document.getElementById("nextImage").addEventListener("click", () => {
      changeImage(1);
    });

    document.getElementById("galleryDots").addEventListener("click", event => {
      const button = event.target.closest("[data-image]");
      if (!button) return;

      currentImageIndex = Number(button.dataset.image);
      renderGallery();
    });

    document.getElementById("closeModal").addEventListener("click", closeReview);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeReview();
    });

    // คลิกภาพเพื่อขยาย
    document.getElementById("galleryImage").addEventListener("click", () => {
      const image = document.getElementById("galleryImage");
      if (!image.src) return;

      document.getElementById("zoomImage").src = image.src;
      document.getElementById("zoomOverlay").classList.add("open");
    });

    document.getElementById("zoomOverlay").addEventListener("click", () => {
      document.getElementById("zoomOverlay").classList.remove("open");
    });

    // รองรับปุ่มลูกศรและ Escape
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.getElementById("zoomOverlay").classList.remove("open");
        closeReview();
      }

      if (modal.classList.contains("open")) {
        if (event.key === "ArrowLeft") changeImage(-1);
        if (event.key === "ArrowRight") changeImage(1);
      }
    });

    searchInput.addEventListener("input", renderGames);
    categoryFilter.addEventListener("change", renderGames);

    // Dark Mode พร้อมจำสถานะขณะเปิดหน้าเว็บนี้
    const themeToggle = document.getElementById("themeToggle");

    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");

      themeToggle.textContent = isDark ? "☀ Light Mode" : "☾ Dark Mode";
    });

    renderGames();
  </script>
</body>
</html>
